name: Auto Blogger Post

on:
  schedule:
    - cron: '0 * * * *' # Har ghante automatically chalega
  workflow_dispatch: # Manual test run ka button dega

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Required Libraries
      run: |
        python -m pip install --upgrade pip
        pip install feedparser beautifulsoup4 google-generativeai google-api-python-client google-auth-httplib2 google-auth-oauthlib

    - name: Run Auto Blogger Script
      run: python rss_to_blogger.py
