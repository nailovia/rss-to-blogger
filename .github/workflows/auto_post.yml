name: Auto Blogger Post

on:
  schedule:
    - cron: '0 */6 * * *'   # Har 6 ghante
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Libraries
      run: |
        python -m pip install --upgrade pip
        pip install feedparser beautifulsoup4 google-api-python-client google-auth-httplib2 google-auth-oauthlib requests

    - name: Run Auto Blogger Script
      env:
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        BLOG_ID: ${{ secrets.BLOG_ID }}
        BLOG_URL: ${{ secrets.BLOG_URL }}
      run: python rss_to_blogger.py

    - name: Commit posted files
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add posted_urls.txt posted_titles.txt posted_images.txt
        git commit -m "Update posted data" || exit 0
        git push
