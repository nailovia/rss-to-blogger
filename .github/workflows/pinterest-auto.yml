name: Pinterest Auto Poster

on:
  schedule:
    - cron: '0 */6 * * *'   # Har 6 ghante
  workflow_dispatch:

jobs:
  pin-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Libraries
      run: |
        python -m pip install --upgrade pip
        pip install feedparser beautifulsoup4 requests

    - name: Run Pinterest Poster
      run: python pinterest_poster.py

    - name: Commit pinned posts
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add pinned_posts.txt
        git commit -m "Update pinned posts" || exit 0
        git push
